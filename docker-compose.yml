services:
  reverse-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: ${NGINX_IMAGE:-meetingku-nginx}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_REVERSE_PROXY_80: ${APP_PROXY_FQDN:?Set APP_PROXY_FQDN in your environment}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - writable_data:/var/www/html/writable:ro
    depends_on:
      meetingku-app:
        condition: service_healthy
    networks:
      - coolify
      - meetingku-internal
    labels:
      - traefik.docker.network=coolify

  meetingku-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: ${APP_IMAGE:-meetingku-app}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000, $$errno, $$error, 3); if (!$$socket) { exit(1); } fclose($$socket);"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      TZ: ${APP_TZ:-Asia/Makassar}
      CI_ENVIRONMENT: production
      app.baseURL: ${APP_BASE_URL:?Set APP_BASE_URL in your environment}
      database.default.hostname: ${DB_HOST:?Set DB_HOST in your environment}
      database.default.database: ${DB_DATABASE:?Set DB_DATABASE in your environment}
      database.default.username: ${DB_USERNAME:?Set DB_USERNAME in your environment}
      database.default.password: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      database.default.DBDriver: ${DB_DRIVER:-Postgre}
      database.default.port: ${DB_PORT:-5432}
      database.default.schema: ${DB_SCHEMA:-public}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-https://waha.kaltarastats.id}
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in your environment}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      zoom.enabled: ${ZOOM_ENABLED:-false}
      zoom.account_id: ${ZOOM_ACCOUNT_ID:-}
      zoom.client_id: ${ZOOM_CLIENT_ID:-}
      zoom.client_secret: ${ZOOM_CLIENT_SECRET:-}
      zoom.password: ${ZOOM_PASSWORD:-bps6500}
    volumes:
      - writable_data:/var/www/html/writable
    networks:
      - coolify
      - meetingku-internal

  meetingku-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: ${APP_IMAGE:-meetingku-app}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php spark wa:worker --sleep=3 --limit=20
    healthcheck:
      disable: true
    environment:
      TZ: ${APP_TZ:-Asia/Makassar}
      CI_ENVIRONMENT: production
      database.default.hostname: ${DB_HOST:?Set DB_HOST in your environment}
      database.default.database: ${DB_DATABASE:?Set DB_DATABASE in your environment}
      database.default.username: ${DB_USERNAME:?Set DB_USERNAME in your environment}
      database.default.password: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      database.default.DBDriver: ${DB_DRIVER:-Postgre}
      database.default.port: ${DB_PORT:-5432}
      database.default.schema: ${DB_SCHEMA:-public}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-https://waha.kaltarastats.id}
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in your environment}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      zoom.enabled: ${ZOOM_ENABLED:-false}
      zoom.account_id: ${ZOOM_ACCOUNT_ID:-}
      zoom.client_id: ${ZOOM_CLIENT_ID:-}
      zoom.client_secret: ${ZOOM_CLIENT_SECRET:-}
      zoom.password: ${ZOOM_PASSWORD:-bps6500}
    volumes:
      - writable_data:/var/www/html/writable
    networks:
      - coolify
      - meetingku-internal

  meetingku-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: ${APP_IMAGE:-meetingku-app}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php spark wa:daily-summary-scheduler --time=15:00 --sleep=60
    healthcheck:
      disable: true
    environment:
      TZ: ${APP_TZ:-Asia/Makassar}
      CI_ENVIRONMENT: production
      database.default.hostname: ${DB_HOST:?Set DB_HOST in your environment}
      database.default.database: ${DB_DATABASE:?Set DB_DATABASE in your environment}
      database.default.username: ${DB_USERNAME:?Set DB_USERNAME in your environment}
      database.default.password: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      database.default.DBDriver: ${DB_DRIVER:-Postgre}
      database.default.port: ${DB_PORT:-5432}
      database.default.schema: ${DB_SCHEMA:-public}
      WA_DAILY_SUMMARY_GROUP_ID: ${WA_DAILY_SUMMARY_GROUP_ID:-120363425375670792@g.us}
      zoom.enabled: ${ZOOM_ENABLED:-false}
      zoom.account_id: ${ZOOM_ACCOUNT_ID:-}
      zoom.client_id: ${ZOOM_CLIENT_ID:-}
      zoom.client_secret: ${ZOOM_CLIENT_SECRET:-}
      zoom.password: ${ZOOM_PASSWORD:-bps6500}
    volumes:
      - writable_data:/var/www/html/writable
    networks:
      - coolify
      - meetingku-internal

volumes:
  writable_data:

networks:
  coolify:
    external: true
  meetingku-internal:
    driver: bridge
