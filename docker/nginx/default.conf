# Rate limit zone for login brute force protection.
# 5 req/min per client IP, 10 MB shared memory (~160k IPs).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

# Rate limit zone for Zoom host shortlink (prevent DoS against Zoom API)
limit_req_zone $binary_remote_addr zone=zoom_zone:10m rate=3r/m;

# FastCGI tuning to avoid buffering large responses to disk.
# meeting.kaltarastats.id home page is ~430 KB; defaults are too small.
fastcgi_buffers 16 32k;
fastcgi_buffer_size 64k;
fastcgi_busy_buffers_size 64k;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20m;

    # Health check (Coolify / uptime probes).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Short-circuit common bot probes so they don't hit PHP-FPM.
    location = /sitemap.xml {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Login: rate-limit POST to slow down brute force.
    # burst=10 absorbs legit double-submits; nodelay enforces immediately.
    location = /auth/login {
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Zoom host shortlink: rate-limit to protect Zoom API quota
    location ~ ^/zoom/start/ {
        limit_req zone=zoom_zone burst=5 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass meetingku-app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\. {
        deny all;
    }
}
